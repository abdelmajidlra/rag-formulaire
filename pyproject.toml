[project]
name = "rag-formulaire"
version = "0.1.0"
description = "RAG PoC for French IRCC forms"
authors = [{name = "Auto Generated"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "tqdm",
    "langdetect",
    "pydantic>=2",
    "rank-bm25",
    "chromadb",
    "sentence-transformers",
    "scikit-learn",
    "transformers",
    "torch",
    "click",
    "docling>=0.1.0; python_version>='3.10'",
    "pdfplumber",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
