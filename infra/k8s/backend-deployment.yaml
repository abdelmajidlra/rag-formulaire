apiVersion: apps/v1
kind: Deployment
metadata:
  name: ircc-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ircc-backend
  template:
    metadata:
      labels:
        app: ircc-backend
    spec:
      containers:
        - name: api
          image: ircc-rag-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "8000"
          volumeMounts:
            - name: rag-data
              mountPath: /app/data
      volumes:
        - name: rag-data
          persistentVolumeClaim:
            claimName: rag-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ircc-backend
spec:
  selector:
    app: ircc-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
