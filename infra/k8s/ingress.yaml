apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ircc-rag-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - host: ircc.example.internal
      http:
        paths:
          - path: /api/?(.*)
            pathType: Prefix
            backend:
              service:
                name: ircc-backend
                port:
                  number: 8000
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: ircc-frontend
                port:
                  number: 80
