version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.api
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  web:
    image: node:20
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://api:8000
    volumes:
      - ../frontend/web-portal:/app
    depends_on:
      - api
