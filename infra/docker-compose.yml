version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.api
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - RAG_FORM_GEN_ENDPOINT=http://llama:8080
      - HF_TOKEN=${HF_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped
    depends_on:
      - llama

  web:
    image: node:20
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://api:8000
    volumes:
      - ../frontend/web-portal:/app
    depends_on:
      - api

  llama:
    image: ghcr.io/huggingface/text-generation-inference:2.1.1
    environment:
      - MODEL_ID=meta-llama/Llama-3.1-8B-Instruct
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - NUM_SHARD=1
    ports:
      - "8080:80"
    volumes:
      - ../.cache/huggingface:/data
    restart: unless-stopped
